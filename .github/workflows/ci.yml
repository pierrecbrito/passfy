name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    name: Build, Lint & Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate --schema=packages/api/prisma/schema.prisma

      - name: Run Backend Automated Tests
        run: npm run test --workspace=@passfy/api
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/passfy_test?schema=public
          JWT_SECRET: test_jwt_secret_key_for_automated_tests_only_passfy
          QR_SECRET_KEY: test_qr_cryptographic_secret_key_hmac_sha256_at_least_32_chars_passfy

      - name: Build Web Application
        run: npm run build --workspace=@passfy/web

